name: Browser service tests (interactive flows)

# Gated: manual + nightly only, so browser flake never blocks a pull request.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to test (prod | test | local)
        type: choice
        options: [prod, test, local]
        default: prod
  schedule:
    - cron: "33 2 * * *" # nightly 02:33 UTC

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      EDCH_ENV: ${{ github.event.inputs.env || 'prod' }}
      # Non-public base URLs come from repo variables, as in http-tests.yml. Specs that submit
      # data assert on the resolved hostname and refuse to run against a production host, so a
      # missing variable here fails the job rather than writing to the live site.
      EDCH_REGISTRY_TEST_URL: ${{ vars.EDCH_REGISTRY_TEST_URL }}
      EDCH_CAP_TEST_URL: ${{ vars.EDCH_CAP_TEST_URL }}
      # Unset → the authenticated flows skip; the rest of the browser layer still runs.
      EDCH_REGISTRY_TEST_USER: ${{ secrets.EDCH_REGISTRY_TEST_USER }}
      EDCH_REGISTRY_TEST_PASSWORD: ${{ secrets.EDCH_REGISTRY_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run browser

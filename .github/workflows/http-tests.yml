name: HTTP service tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to test (prod | test)
        type: choice
        options: [prod, test]
        default: prod
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC

jobs:
  http:
    runs-on: ubuntu-latest
    env:
      EDCH_ENV: ${{ github.event.inputs.env || 'prod' }}
      # Non-public test/local base URLs come from repo variables, not the committed inventory.
      # Unset → each service falls back to its public prod URL. To exercise the Drupal 11 test
      # instance in CI, set EDCH_REGISTRY_TEST_URL as a repo variable and dispatch with env=test.
      EDCH_REGISTRY_TEST_URL: ${{ vars.EDCH_REGISTRY_TEST_URL }}
      EDCH_CAP_TEST_URL: ${{ vars.EDCH_CAP_TEST_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; a dependency postinstall could otherwise reach
          # the token checkout leaves in .git/config.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Enforce the strict tsconfig on the browser .ts files (fast, no browser needed).
      - run: bun run typecheck
      # @external hits api.geonames.org; exclude it on pull requests so a third-party outage or
      # rate limit cannot redden an unrelated PR. Scheduled and manual runs still exercise it.
      - if: github.event_name == 'pull_request'
        run: bun run test --tags "not @external"
      - if: github.event_name != 'pull_request'
        run: bun run test

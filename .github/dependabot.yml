---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Cooldown so a yanked or compromised release is not applied automatically;
    # zizmor's dependabot-cooldown audit requires default-days >= 7.
    cooldown:
      default-days: 7

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped pull request rather than one per dependency: the dev
    # dependency set is small and the CI gate is all-or-nothing anyway.
    groups:
      test-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
